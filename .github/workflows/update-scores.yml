name: Update live scores

on:
  schedule:
    # Every 5 minutes during the knockout window (Jun 28 – Jul 19).
    # GitHub cron is UTC; matches run roughly 16:00–05:00 UTC.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch scores
        run: python3 wc2026/update_scores.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet wc2026/results.json; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "suryabhupa"
          git config user.email "6156634+suryabhupa@users.noreply.github.com"
          git add wc2026/results.json
          git commit -m "Auto-update scores"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pages deploys occasionally fail with "try again later". If the last
      # deployed commit isn't HEAD, poke a rebuild so the site catches up even
      # when scores haven't changed this tick.
      - name: Ensure Pages is up to date
        if: steps.commit.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(git rev-parse HEAD)
          DEPLOYED=$(gh api repos/${{ github.repository }}/pages/builds \
            --jq '[.[] | select(.status=="built")][0].commit' 2>/dev/null || echo "")
          if [ "$DEPLOYED" != "$HEAD" ]; then
            echo "Site is stale ($DEPLOYED vs $HEAD) — requesting Pages build"
            gh api -X POST repos/${{ github.repository }}/pages/builds || true
          else
            echo "Site is current."
          fi
