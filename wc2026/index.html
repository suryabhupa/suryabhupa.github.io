<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>World Cup 2026 — Knockout Bracket Predictor</title>
<style>
  :root {
    --bg: #f7f1e3;
    --card: #ffffff;
    --line: #d8ceb4;
    --connector: #bdb293;
    --text: #2e2812;
    --muted: #93875f;
    --pick: #1e6b3a;
    --pick-bg: #e7f2eb;
    --gold: #b8860b;
    --gold-bg: #fdf5e0;
    --correct: #1e6b3a;
    --wrong: #b3261e;
    --wrong-bg: #fbeae9;

    --match-h: 64px;
    --bracket-h: 744px;        /* 8 R32 matches space-around → 93px per slot */
    --col-w: 184px;
    --gap: 36px;
    --stub: 18px;              /* half of gap */
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { font-size: 12px; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
  input[type="text"], input[type="number"] {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font: inherit; font-size: 13px; width: 180px;
  }
  input[type="number"] { font-variant-numeric: tabular-nums; }
  input[type="text"]:focus, input[type="number"]:focus { outline: 2px solid var(--pick); outline-offset: -1px; }
  button {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 7px 12px; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  button:hover { background: #fdfbf4; border-color: var(--connector); }
  button:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }
  button.primary { background: var(--pick); border-color: var(--pick); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  .progress { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- Bracket layout ------------------------------------------------ */
  .bracket-scroll { overflow-x: auto; padding: 36px 24px 28px; }
  .bracket {
    display: flex; align-items: center; gap: var(--gap);
    min-width: min-content; margin: 0 auto; width: fit-content;
  }
  .side { display: flex; gap: var(--gap); align-items: stretch; }
  .side.right { flex-direction: row-reverse; }

  .col {
    display: flex; flex-direction: column; justify-content: space-around;
    width: var(--col-w); height: var(--bracket-h); position: relative;
  }
  .round-label {
    position: absolute; top: -20px; left: 0; right: 0;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); text-align: center;
  }

  /* ---- Match card ---------------------------------------------------- */
  .match {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    height: var(--match-h); display: flex; flex-direction: column;
    position: relative; box-shadow: 0 1px 2px rgba(46,40,18,0.06);
  }
  .team {
    flex: 1; display: flex; align-items: center; gap: 7px; padding: 0 9px;
    cursor: pointer; font-size: 13px; font-weight: 500; user-select: none;
    border-left: 3px solid transparent;
  }
  .side.right .team { border-left: none; border-right: 3px solid transparent; }
  .team + .team { border-top: 1px solid var(--line); }
  .team:hover { background: #fbf7ec; }
  .team.empty { color: var(--muted); font-size: 11px; font-weight: 400; cursor: default; font-style: italic; }
  .team.empty:hover { background: transparent; }
  .team.picked { background: var(--pick-bg); border-left-color: var(--pick); color: var(--pick); font-weight: 600; }
  .side.right .team.picked { border-right-color: var(--pick); }
  .team.picked:hover { background: #dbeee2; }
  .flag { display: inline-flex; align-items: center; flex-shrink: 0; }
  .flag img {
    height: 14px; width: auto; display: block;
    border-radius: 2px; box-shadow: 0 0 1px rgba(46,40,18,0.4);
  }
  .team-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match-tag {
    position: absolute; top: -7px; font-size: 9px; color: var(--muted);
    background: var(--bg); padding: 0 4px; font-variant-numeric: tabular-nums;
    border-radius: 3px;
  }
  .side.left .match-tag, .center .match-tag { left: 6px; }
  .side.right .match-tag { right: 6px; }
  .match-date {
    position: absolute; top: calc(100% + 3px); left: 2px; right: 2px;
    font-size: 10px; font-style: italic; color: var(--muted);
    line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }
  .side.right .match-date { text-align: right; }

  /* ---- Results & scoring -------------------------------------------- */
  .match.done .team { cursor: default; }
  .match.done .team:hover { background: transparent; }
  .match.done .team.picked:hover { background: var(--pick-bg); }
  .team.actual { font-weight: 700; }
  .goals {
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: 12px;
    min-width: 14px; text-align: right; flex-shrink: 0;
  }
  .team:not(.actual) .goals { opacity: 0.55; font-weight: 500; }
  .pens { font-size: 9px; color: var(--muted); margin-left: 3px; flex-shrink: 0; }
  .live-badge {
    position: absolute; top: -8px; z-index: 1;
    background: var(--wrong); color: #fff; font-size: 8.5px; font-weight: 700;
    padding: 2px 5px 2px 12px; border-radius: 8px; letter-spacing: 0.03em;
  }
  .side.left .live-badge, .center .live-badge { right: -6px; }
  .side.right .live-badge { left: -6px; }
  .live-badge::before {
    content: ""; position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: #fff;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @media (prefers-reduced-motion: reduce) { .live-badge::before { animation: none; } }
  .match.live { border-color: var(--wrong); }
  .team.eliminated .team-name { opacity: 0.5; text-decoration: line-through; text-decoration-thickness: 1px; }
  .verdict {
    position: absolute; top: -8px; width: 16px; height: 16px; border-radius: 50%;
    font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; color: #fff;
    z-index: 1;
  }
  .side.left .verdict, .center .verdict { right: -6px; }
  .side.right .verdict { left: -6px; }
  .verdict.correct { background: var(--correct); }
  .verdict.wrong { background: var(--wrong); }
  .match.done .team.picked.wrong-pick { background: var(--wrong-bg); border-left-color: var(--wrong); color: var(--wrong); }
  .side.right .match.done .team.picked.wrong-pick { border-right-color: var(--wrong); }
  .miss-note {
    position: absolute; top: calc(100% + 3px); left: 2px; right: 2px;
    font-size: 9px; font-style: italic; color: var(--wrong);
    line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side.right .miss-note { text-align: right; }
  .score {
    font-size: 12px; font-weight: 600; color: var(--text);
    padding: 4px 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; font-variant-numeric: tabular-nums;
  }
  .score b { color: var(--correct); }

  /* ---- Tabs ---------------------------------------------------------- */
  .tabs { display: flex; gap: 4px; margin-right: 8px; }
  .tab {
    padding: 6px 14px; border: 1px solid var(--line); background: var(--card);
    border-radius: 6px; font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; color: var(--muted);
  }
  .tab:hover { border-color: var(--connector); }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Compare view -------------------------------------------------- */
  .compare-wrap { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .add-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .add-row input {
    flex: 1; min-width: 300px; background: var(--card); border: 1px solid var(--line);
    color: var(--text); padding: 9px 12px; border-radius: 6px; font: inherit; font-size: 13px;
  }
  .add-row input:focus { outline: 2px solid var(--pick); outline-offset: -1px; }
  .cmp-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }
  .pool-hdr { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .pool-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 4px 0 2px; }
  .pool-sub { font-size: 12px; color: var(--muted); }
  .pool-hdr .link-btn {
    margin-left: auto; background: none; border: none; color: var(--muted);
    font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px 0;
  }
  .pool-hdr .link-btn:hover { color: var(--text); }

  .leaderboard {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    margin-bottom: 28px;
  }
  .leaderboard th, .leaderboard td {
    padding: 10px 12px; text-align: left; font-size: 13px;
    border-bottom: 1px solid var(--line);
  }
  .leaderboard th {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); background: #fdfaf1;
  }
  .leaderboard tr:last-child td { border-bottom: none; }
  .leaderboard tbody tr { cursor: pointer; }
  .leaderboard tbody tr:hover { background: #fbf7ec; }
  .leaderboard .rank { width: 32px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .leaderboard .lb-name { font-weight: 600; }
  .leaderboard .lb-score { font-variant-numeric: tabular-nums; }
  .leaderboard .lb-score b { color: var(--correct); font-size: 15px; }
  .leaderboard .lb-champ { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
  .leaderboard td { vertical-align: middle; }
  .leaderboard .rounds { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .leaderboard .lb-tb { font-variant-numeric: tabular-nums; }
  .leaderboard .tb-diff { font-size: 10px; color: var(--muted); margin-left: 2px; }
  .leaderboard .rm {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 16px; padding: 2px 6px; line-height: 1;
  }
  .leaderboard .rm:hover { color: var(--wrong); }

  /* ---- Mini brackets (compare view) --------------------------------- */
  .mini-list { display: flex; flex-direction: column; gap: 24px; }
  .mini-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px 18px;
  }
  .mini-hdr { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .mini-hdr .nm { font-size: 15px; font-weight: 700; }
  .mini-hdr .sc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mini-hdr .sc b { color: var(--correct); font-size: 14px; }
  .mini-hdr .ch { font-size: 12px; color: var(--muted); margin-left: auto; }
  .mini-hdr .ch .flag img { height: 12px; }

  .mini-scroll { overflow-x: auto; }
  .mini {
    --match-h: 22px;
    --bracket-h: 248px;
    --col-w: 108px;
    --gap: 20px;
    --stub: 10px;
    display: flex; align-items: center; gap: var(--gap);
    min-width: min-content; margin: 0 auto; width: fit-content;
  }
  .mini .side { display: flex; gap: var(--gap); align-items: stretch; }
  .mini .side.right { flex-direction: row-reverse; }
  .mini .col {
    display: flex; flex-direction: column; justify-content: space-around;
    width: var(--col-w); height: var(--bracket-h); position: relative;
  }
  .mini .col.r16 { --vline: calc(var(--bracket-h) / 8); }
  .mini .col.qf  { --vline: calc(var(--bracket-h) / 4); }
  .mini .col.sf  { --vline: calc(var(--bracket-h) / 2); }
  .mini .m {
    height: var(--match-h); border: 1px solid var(--line); border-radius: 4px;
    background: var(--card); position: relative;
    display: flex; align-items: center; gap: 4px; padding: 0 6px;
    font-size: 10.5px; font-weight: 500;
  }
  .mini .m .flag img { height: 10px; }
  .mini .m .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .mini .m.none { background: transparent; border-style: dashed; color: var(--muted); justify-content: center; }
  .mini .m.none.filled { justify-content: flex-start; opacity: 0.65; }
  .mini .m.none.filled .nm { font-weight: 400; }
  .mini .m.none .vs { font-size: 9px; letter-spacing: -0.5px; display: inline-flex; align-items: center; gap: 3px; }
  .mini .m.none .vs img { height: 9px; width: auto; border-radius: 1px; }
  .mini .m.pending { background: var(--card); }
  .mini .m.correct { background: var(--pick-bg); border-color: var(--correct); color: var(--correct); font-weight: 600; }
  .mini .m.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
  .mini .m.wrong .nm { text-decoration: line-through; text-decoration-thickness: 1px; }
  /* connectors (same math as full bracket, thinner lines) */
  .mini .side .m::after {
    content:""; position:absolute; width:var(--stub); height:1px;
    background:var(--connector); top:calc(50% - 0.5px);
  }
  .mini .side.left  .m::after { left:100%; }
  .mini .side.right .m::after { right:100%; }
  .mini .side .col.r16 .m::before,
  .mini .side .col.qf  .m::before,
  .mini .side .col.sf  .m::before {
    content:""; position:absolute; width:var(--stub); height:var(--vline);
    top:calc(50% - var(--vline)/2);
    background:linear-gradient(var(--connector),var(--connector)) center/100% 1px no-repeat;
  }
  .mini .side.left  .col.r16 .m::before, .mini .side.left  .col.qf .m::before, .mini .side.left  .col.sf .m::before { right:100%; border-left:1px solid var(--connector); }
  .mini .side.right .col.r16 .m::before, .mini .side.right .col.qf .m::before, .mini .side.right .col.sf .m::before { left:100%; border-right:1px solid var(--connector); }
  .mini .center { width: var(--col-w); height: var(--bracket-h); position: relative; }
  .mini .center .champ {
    --ch: calc(var(--match-h) * 1.4);
    position:absolute; left:0; right:0; top:calc(50% - var(--ch)/2);
    height:var(--ch); font-size:11px; font-weight:700; justify-content:center;
  }
  .mini .center .champ::before, .mini .center .champ::after {
    content:""; position:absolute; width:var(--gap); height:1px;
    background:var(--connector); top:calc(50% - 0.5px);
  }
  .mini .center .champ::before { right:100%; }
  .mini .center .champ::after  { left:100%; }
  .mini .center .third {
    position:absolute; left:0; right:0; bottom:8px;
  }
  .mini .center .lbl {
    position:absolute; left:0; right:0;
    font-size:8px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted); text-align:center;
  }
  .mini .center .lbl.champ-lbl { top:calc(50% - var(--match-h)*0.7 - 13px); }
  .mini .center .lbl.third-lbl { bottom:calc(8px + var(--match-h) + 3px); }

  /* ---- Connectors ---------------------------------------------------- */
  /* Per-round vertical connector heights = bracket-h / (2 × matches in prev round) × 2
     i.e. distance between adjacent prev-round match centers.               */
  .col.r16 { --vline: calc(var(--bracket-h) / 8); }   /* 82px  */
  .col.qf  { --vline: calc(var(--bracket-h) / 4); }   /* 164px */
  .col.sf  { --vline: calc(var(--bracket-h) / 2); }   /* 328px */

  /* Output stub from every match toward the center */
  .side .match::after {
    content: ""; position: absolute; width: var(--stub); height: 2px;
    background: var(--connector); top: calc(50% - 1px);
  }
  .side.left  .match::after { left: 100%; }
  .side.right .match::after { right: 100%; }

  /* Input bracket on receiving matches: vertical line + center stub */
  .side .col.r16 .match::before,
  .side .col.qf  .match::before,
  .side .col.sf  .match::before {
    content: ""; position: absolute; width: var(--stub); height: var(--vline);
    top: calc(50% - var(--vline) / 2);
    background: linear-gradient(var(--connector),var(--connector)) center/100% 2px no-repeat;
  }
  .side.left  .col.r16 .match::before,
  .side.left  .col.qf  .match::before,
  .side.left  .col.sf  .match::before { right: 100%; border-left: 2px solid var(--connector); }
  .side.right .col.r16 .match::before,
  .side.right .col.qf  .match::before,
  .side.right .col.sf  .match::before { left: 100%; border-right: 2px solid var(--connector); }

  /* SF → Final: straight line into the center column from both sides */
  .center .final::before, .center .final::after {
    content: ""; position: absolute; width: var(--gap); height: 2px;
    background: var(--connector); top: calc(50% - 1px);
  }
  .center .final::before { right: 100%; }
  .center .final::after  { left: 100%; }

  /* ---- Center column ------------------------------------------------- */
  .center { width: 208px; height: var(--bracket-h); position: relative; }
  .center-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); text-align: center;
  }
  .center .final {
    position: absolute; left: 0; right: 0;
    top: calc(50% - var(--match-h) / 2);
  }
  .final-label { position: absolute; left: 0; right: 0; top: calc(50% - var(--match-h) / 2 - 22px); }
  .champion {
    position: absolute; left: 0; right: 0; top: calc(50% + var(--match-h) / 2 + 24px);
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: 12px; text-align: center;
  }
  .champion.filled { border-color: var(--gold); background: var(--gold-bg); }
  .champion-label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .champion.filled .champion-label { color: var(--gold); }
  .champion-team { font-size: 16px; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .champion.filled .champion-team { color: var(--gold); }
  .third-block { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  .tb-box {
    position: absolute; left: 0; right: 0; top: calc(50% + var(--match-h) / 2 + 100px);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px;
  }
  .tb-box .lbl { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .tb-box .hint { font-size: 9px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
  .tb-box input {
    width: 100%; background: #fdfaf1; border: 1px solid var(--line);
    padding: 6px 8px; border-radius: 4px; font: inherit; font-size: 15px; font-weight: 700;
    text-align: center; font-variant-numeric: tabular-nums; color: var(--text);
  }
  .tb-box input:focus { outline: 2px solid var(--pick); outline-offset: -1px; }
  .tb-box.locked { background: #fdfaf1; }
  .tb-box .tb-value {
    font-size: 18px; font-weight: 700; text-align: center;
    font-variant-numeric: tabular-nums; padding: 4px 0;
  }

  /* ---- Copy-link popup ---------------------------------------------- */
  .share-wrap { position: relative; display: inline-block; }
  .copy-tip {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(4px);
    background: var(--text); color: var(--bg);
    padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: 600;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .copy-tip::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--text);
  }
  .copy-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .copy-tip { transition: none; } }

  /* ---- Winner celebration -------------------------------------------- */
  #confetti {
    position: fixed; inset: 0; pointer-events: none; z-index: 998;
  }
  .celebrate {
    position: fixed; inset: 0; z-index: 999; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    animation: celeb-in .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  .celebrate .banner {
    background: var(--card); border: 2px solid var(--gold); border-radius: 14px;
    padding: 28px 40px; text-align: center; pointer-events: auto;
    box-shadow: 0 20px 60px rgba(46,40,18,0.25);
    max-width: 90vw;
  }
  .celebrate .trophy { font-size: 48px; line-height: 1; margin-bottom: 8px; animation: trophy-bob 1.6s ease-in-out infinite; }
  .celebrate .congrats { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  .celebrate .winner { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; }
  .celebrate .sub { font-size: 13px; color: var(--muted); }
  .celebrate .close {
    margin-top: 16px; background: var(--gold); color: #2e2812; border: none;
    padding: 8px 18px; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }

<script>
(function() {
  // Flags: flagcdn.com images (works on Windows where flag emoji don't render).
  // `iso` is ISO 3166-1 alpha-2; England uses the gb-eng subdivision code.
  const FLAG=iso=>'<img alt="" loading="lazy" '+
    'src="https://flagcdn.com/h24/'+iso+'.png" '+
    'srcset="https://flagcdn.com/h48/'+iso+'.png 2x">';
  const TEAMS = {
    RSA:{n:"South Africa",iso:"za"}, CAN:{n:"Canada",iso:"ca"},
    BRA:{n:"Brazil",iso:"br"}, JPN:{n:"Japan",iso:"jp"},
    GER:{n:"Germany",iso:"de"}, PAR:{n:"Paraguay",iso:"py"},
    NED:{n:"Netherlands",iso:"nl"}, MAR:{n:"Morocco",iso:"ma"},
    CIV:{n:"Ivory Coast",iso:"ci"}, NOR:{n:"Norway",iso:"no"},
    FRA:{n:"France",iso:"fr"}, SWE:{n:"Sweden",iso:"se"},
    MEX:{n:"Mexico",iso:"mx"}, ECU:{n:"Ecuador",iso:"ec"},
    ENG:{n:"England",iso:"gb-eng"}, COD:{n:"DR Congo",iso:"cd"},
    BEL:{n:"Belgium",iso:"be"}, SEN:{n:"Senegal",iso:"sn"},
    USA:{n:"United States",iso:"us"}, BIH:{n:"Bosnia & Herz.",iso:"ba"},
    ESP:{n:"Spain",iso:"es"}, AUT:{n:"Austria",iso:"at"},
    POR:{n:"Portugal",iso:"pt"}, CRO:{n:"Croatia",iso:"hr"},
    SUI:{n:"Switzerland",iso:"ch"}, ALG:{n:"Algeria",iso:"dz"},
    AUS:{n:"Australia",iso:"au"}, EGY:{n:"Egypt",iso:"eg"},
    ARG:{n:"Argentina",iso:"ar"}, CPV:{n:"Cape Verde",iso:"cv"},
    COL:{n:"Colombia",iso:"co"}, GHA:{n:"Ghana",iso:"gh"}
  };
  for(const t of Object.values(TEAMS)) t.f=FLAG(t.iso);

  // d = "date, time ET · city". Times TBD for R16 onward.
  const MATCHES = {
    73:{d:"Jun 28, 3:00 PM ET · Los Angeles",s:[{t:"RSA"},{t:"CAN"}]},
    74:{d:"Jun 29, 4:30 PM ET · Boston",s:[{t:"GER"},{t:"PAR"}]},
    75:{d:"Jun 29, 9:00 PM ET · Monterrey",s:[{t:"NED"},{t:"MAR"}]},
    76:{d:"Jun 29, 1:00 PM ET · Houston",s:[{t:"BRA"},{t:"JPN"}]},
    77:{d:"Jun 30, 5:00 PM ET · New York/NJ",s:[{t:"FRA"},{t:"SWE"}]},
    78:{d:"Jun 30, 1:00 PM ET · Dallas",s:[{t:"CIV"},{t:"NOR"}]},
    79:{d:"Jun 30, 9:00 PM ET · Mexico City",s:[{t:"MEX"},{t:"ECU"}]},
    80:{d:"Jul 1, 12:00 PM ET · Atlanta",s:[{t:"ENG"},{t:"COD"}]},
    81:{d:"Jul 1, 8:00 PM ET · Bay Area",s:[{t:"USA"},{t:"BIH"}]},
    82:{d:"Jul 1, 4:00 PM ET · Seattle",s:[{t:"BEL"},{t:"SEN"}]},
    83:{d:"Jul 2, 7:00 PM ET · Toronto",s:[{t:"POR"},{t:"CRO"}]},
    84:{d:"Jul 2, 3:00 PM ET · Los Angeles",s:[{t:"ESP"},{t:"AUT"}]},
    85:{d:"Jul 2, 11:00 PM ET · Vancouver",s:[{t:"SUI"},{t:"ALG"}]},
    86:{d:"Jul 3, 1:00 PM ET · Miami",s:[{t:"ARG"},{t:"CPV"}]},
    87:{d:"Jul 3, 7:00 PM ET · Kansas City",s:[{t:"COL"},{t:"GHA"}]},
    88:{d:"Jul 3, 9:30 PM ET · Dallas",s:[{t:"AUS"},{t:"EGY"}]},
    89:{d:"Jul 4 · Philadelphia",s:[{w:74},{w:77}]},
    90:{d:"Jul 4 · Houston",s:[{w:73},{w:75}]},
    91:{d:"Jul 5 · New York/NJ",s:[{w:76},{w:78}]},
    92:{d:"Jul 5 · Mexico City",s:[{w:79},{w:80}]},
    93:{d:"Jul 6 · Dallas",s:[{w:83},{w:84}]},
    94:{d:"Jul 6 · Seattle",s:[{w:81},{w:82}]},
    95:{d:"Jul 7 · Atlanta",s:[{w:86},{w:88}]},
    96:{d:"Jul 7 · Vancouver",s:[{w:85},{w:87}]},
    97:{d:"Jul 9 · Boston",s:[{w:89},{w:90}]},
    98:{d:"Jul 10 · Los Angeles",s:[{w:93},{w:94}]},
    99:{d:"Jul 11 · Miami",s:[{w:91},{w:92}]},
    100:{d:"Jul 11 · Kansas City",s:[{w:95},{w:96}]},
    101:{d:"Jul 14 · Dallas",s:[{w:97},{w:98}]},
    102:{d:"Jul 15 · Atlanta",s:[{w:99},{w:100}]},
    103:{d:"Jul 18 · Miami",s:[{l:101},{l:102}]},
    104:{d:"Jul 19 · New York/NJ",s:[{w:101},{w:102}]}
  };

  const LEFT = {
    r32:[74,77,73,75,83,84,81,82],
    r16:[89,90,93,94],
    qf:[97,98],
    sf:[101]
  };
  const RIGHT = {
    r32:[76,78,79,80,86,88,85,87],
    r16:[91,92,95,96],
    qf:[99,100],
    sf:[102]
  };
  const ORDER = []; for (let i=73;i<=104;i++) ORDER.push(i);

  // Live scores: fetched from results.json. SCORES[id] = {score:[a,b], pens?, status:"FT"|"LIVE", minute?}
  // RESULTS[id] = winning slot index (derived from SCORES where status=FT).
  let SCORES = {}, RESULTS = {};

  function deriveResults(){
    RESULTS={};
    for(const [id,r] of Object.entries(SCORES)){
      if(r.status!=="FT") continue;
      let w;
      if(r.score[0]!==r.score[1]) w=r.score[0]>r.score[1]?0:1;
      else if(r.pens) w=r.pens[0]>r.pens[1]?0:1;
      else continue;
      RESULTS[+id]=w;
    }
  }
  // Can `team` still end up in this slot given actual RESULTS so far?
  // Handles winner-feeds AND loser-feeds (3rd place): a SF winner is dead
  // for M103 but alive for M104; a SF loser is the reverse.
  function canFillSlot(slot,team){
    if(slot.t) return slot.t===team;
    const feed=slot.w!=null?slot.w:slot.l;
    const needWin=slot.w!=null;
    if(RESULTS[feed]!=null){
      return (needWin?winnerOf(feed,RESULTS):loserOf(feed,RESULTS))===team;
    }
    const m=MATCHES[feed];
    return canFillSlot(m.s[0],team)||canFillSlot(m.s[1],team);
  }
  // A predicted winner is "dead" for match `id` if it can't occupy either slot.
  function isDead(id,team){
    const m=MATCHES[id];
    return !canFillSlot(m.s[0],team)&&!canFillSlot(m.s[1],team);
  }
  // ---- Live scores: ESPN direct (primary) with results.json fallback ----
  // ESPN display name → our team code. Includes aliases ESPN uses.
  const NAME2CODE=(()=>{
    const m={};
    for(const [code,t] of Object.entries(TEAMS)) m[t.n]=code;
    Object.assign(m,{
      "USA":"USA","Côte d'Ivoire":"CIV","Cote d'Ivoire":"CIV",
      "Congo DR":"COD","Bosnia-Herzegovina":"BIH","Bosnia and Herzegovina":"BIH",
      "Cape Verde Islands":"CPV"
    });
    return m;
  })();

  function espnToScores(events){
    // Normalize ESPN events → {Set(codeA,codeB) → entry}
    const byPair=new Map();
    for(const ev of events||[]){
      const comp=(ev.competitions||[])[0]||{};
      const cs=comp.competitors||[];
      if(cs.length!==2) continue;
      const codes=cs.map(c=>NAME2CODE[(c.team&&c.team.displayName||'').trim()]);
      if(!codes[0]||!codes[1]) continue;
      const st=(comp.status&&comp.status.type)||{};
      const state=st.state; // pre|in|post
      if(state==='pre') continue;
      const g=cs.map(c=>+c.score||0);
      const entry={score:null,status:state==='post'?'FT':'LIVE'};
      if(state==='in') entry.minute=st.shortDetail||st.detail||'';
      const so=cs.map(c=>c.shootoutScore!=null?+c.shootoutScore:null);
      const pens=(so[0]!=null&&so[1]!=null)?so:null;
      // Store by code so we can reorder to our top/bottom later.
      byPair.set([codes[0],codes[1]].sort().join('|'),{
        codes,goals:g,pens,entry,
        winnerFlag:cs.map(c=>!!c.winner)
      });
    }
    // Walk our matches in order; resolve participants; find matching ESPN event.
    const scores={};
    const resultsSoFar={};
    const applyResult=(id,e)=>{
      if(e.status!=='FT') return;
      let w;
      if(e.score[0]!==e.score[1]) w=e.score[0]>e.score[1]?0:1;
      else if(e.pens) w=e.pens[0]>e.pens[1]?0:1;
      else return;
      resultsSoFar[id]=w;
    };
    for(const id of ORDER){
      const [a,b]=slotTeams(id,resultsSoFar);
      if(!a||!b) continue;
      const key=[a,b].sort().join('|');
      const hit=byPair.get(key);
      if(!hit) continue;
      // Map ESPN's competitor order → our top/bottom (a,b).
      const idxA=hit.codes.indexOf(a), idxB=hit.codes.indexOf(b);
      const e={score:[hit.goals[idxA],hit.goals[idxB]],status:hit.entry.status};
      if(hit.entry.minute) e.minute=hit.entry.minute;
      if(hit.pens) e.pens=[hit.pens[idxA],hit.pens[idxB]];
      else if(e.status==='FT'&&e.score[0]===e.score[1]){
        // Tied at FT with no shootout data — use ESPN winner flag.
        if(hit.winnerFlag[idxA]) e.pens=[1,0];
        else if(hit.winnerFlag[idxB]) e.pens=[0,1];
      }
      scores[id]=e;
      applyResult(id,e);
    }
    return scores;
  }

  const ESPN_URL="https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260628-20260719&limit=200";

  async function fetchScores(){
    const before=JSON.stringify(SCORES);
    let next=null;
    // Primary: ESPN direct (CORS-open, real-time).
    try{
      const r=await fetch(ESPN_URL,{cache:"no-store"});
      if(r.ok){
        const data=await r.json();
        const s=espnToScores(data.events);
        if(Object.keys(s).length) next=s;
      }
    }catch(e){/* fall through */}
    // results.json: fallback for scores, and always the source for the
    // tiebreaker actual (ESPN's basic scoreboard doesn't expose corners/cards).
    try{
      const r=await fetch("results.json?t="+Date.now(),{cache:"no-store"});
      if(r.ok){
        const d=await r.json();
        if(d){
          if(typeof d.tiebreaker==='number') TB_ACTUAL=d.tiebreaker;
          if(!next && d.matches) next=Object.fromEntries(Object.entries(d.matches).map(([k,v])=>[+k,v]));
        }
      }
    }catch(e){}
    if(!next) return;
    SCORES=next;
    deriveResults();
    if(JSON.stringify(SCORES)!==before){
      if(mode==="compare") renderCompare(); else render();
    }
  }

  let picks = {}, bracketName = "", bracketTB = null;
  let TB_ACTUAL = null;   // set from results.json once the final is done
  // Final has kicked off (LIVE or FT) → guesses revealed, input locked.
  const finalStarted=()=>SCORES[104]!=null;

  // Strip tracking params (fbclid, utm_*, gclid, igshid, …) that Messenger/etc.
  // append. This page uses only the #hash for state, so any ?query is noise.
  if(location.search){
    history.replaceState(null,"",location.pathname+location.hash);
  }
  const cleanUrl=()=>location.origin+location.pathname+location.hash;

  // Generic resolver: `src` is an object mapping matchId → chosen slot index.
  // Passing `picks` gives the user's predicted bracket; `RESULTS` gives reality;
  // a merged {...picks, ...RESULTS} gives the display bracket (reality where known,
  // user prediction elsewhere).
  function teamAt(slot,src){
    if(slot.t) return slot.t;
    if(slot.w!=null) return winnerOf(slot.w,src);
    if(slot.l!=null) return loserOf(slot.l,src);
    return null;
  }
  function winnerOf(id,src){
    const p=src[id]; if(p==null) return null;
    return teamAt(MATCHES[id].s[p],src);
  }
  function loserOf(id,src){
    const p=src[id]; if(p==null) return null;
    return teamAt(MATCHES[id].s[1-p],src);
  }
  function slotTeams(id,src){
    const m=MATCHES[id]; return [teamAt(m.s[0],src),teamAt(m.s[1],src)];
  }

  // Display source: reality wins where known (bracket shows actual advancing teams).
  const displaySrc=()=>Object.assign({},picks,RESULTS);
  // Prediction source: user's picks win; reality fills gaps they haven't picked.
  const mySrc=()=>Object.assign({},RESULTS,picks);

  function setPick(id,slot){
    if(RESULTS[id]!=null) return;                       // completed → locked
    const t=slotTeams(id,displaySrc()); if(!t[slot]) return;
    // Snapshot predicted winners so we can invalidate stale downstream picks.
    const src0=mySrc(), before={};
    for(const mid of ORDER) if(picks[mid]!=null) before[mid]=winnerOf(mid,src0);
    if(picks[id]===slot) delete picks[id]; else picks[id]=slot;
    for(const mid of ORDER){
      if(mid===id||picks[mid]==null) continue;
      if(winnerOf(mid,mySrc())!==before[mid]) delete picks[mid];
    }
    save(); render();
  }

  // ---- URL persistence: compact 11-char base64url of 32×2 bits ---------
  const B64U={
    enc:b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
    dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  };
  // Encoding: bytes 0-7 = 32 matches × 2 bits; byte 8 (optional) = tiebreaker
  // guess (0-99, 255=unset). Old 8-byte codes still decode with tb=null.
  function encodePicks(tb){
    const hasTB=tb!=null;
    const bytes=new Uint8Array(hasTB?9:8);
    for(let i=0;i<ORDER.length;i++){
      const p=picks[ORDER[i]];
      const v=p===0?1:p===1?2:0;
      bytes[i>>2]|=v<<((i&3)*2);
    }
    if(hasTB) bytes[8]=Math.max(0,Math.min(99,tb|0));
    return B64U.enc(bytes);
  }
  function decodePicks(s){
    const out={picks:{},tb:null};
    if(!s) return out;
    if(/^[01-]+$/.test(s)&&s.length>12){        // legacy long format
      for(let i=0;i<ORDER.length&&i<s.length;i++){
        if(s[i]==='0')out.picks[ORDER[i]]=0; else if(s[i]==='1')out.picks[ORDER[i]]=1;
      }
      return out;
    }
    try{
      const bytes=B64U.dec(s);
      for(let i=0;i<ORDER.length;i++){
        const v=(bytes[i>>2]>>((i&3)*2))&3;
        if(v===1)out.picks[ORDER[i]]=0; else if(v===2)out.picks[ORDER[i]]=1;
      }
      if(bytes.length>=9 && bytes[8]!==255) out.tb=bytes[8];
    }catch(e){}
    return out;
  }
  // ---- Compare state ---------------------------------------------------
  // entries: [{name, code}] — code is the compact base64url form
  let cmpEntries=[];
  let cmpFromPool=false;   // true when entries were loaded from pool.json (read-only)
  let mode="bracket";
  const POOL_TITLE="bach to the future";
  // Pool sources tried in order. First one that returns ≥1 entry wins.
  // Sheet columns: A=name, B=code. Sheet must be "anyone with link can view".
  const POOL_SOURCES=[
    "https://docs.google.com/spreadsheets/d/11WoRBq-NoBLqTZqpcgaw-BIAd8MyWNOjTyTnxdtCKz0/gviz/tq?tqx=out:json&gid=0",
    "pool.json"
  ];

  function parsePool(url,txt){
    if(url.includes('gviz')){
      const m=txt.match(/setResponse\((.*)\);?\s*$/s);
      if(!m) return [];
      const data=JSON.parse(m[1]);
      return (data.table.rows||[]).map(r=>({
        name:String(r.c?.[0]?.v||'').trim(),
        code:String(r.c?.[1]?.v||'').trim()
      })).filter(e=>e.name&&e.code);
    }
    return (JSON.parse(txt).entries||[]);
  }
  async function fetchPool(){
    for(const url of POOL_SOURCES){
      try{
        const sep=url.includes('?')?'&':'?';
        const txt=await fetch(url+sep+"t="+Date.now(),{cache:"no-store"}).then(r=>r.text());
        const entries=parsePool(url,txt);
        if(entries.length){
          cmpEntries=entries.map(e=>({name:e.name,code:normalizeCode(e.code)}));
          cmpFromPool=true;
          return;
        }
      }catch(e){console.warn("pool source failed:",url,e);}
    }
    cmpFromPool=true; // still mark as pool mode (read-only) even if empty
  }

  function parseBracketRef(input){
    // Accepts: full URL, "#n=..&p=..", "n=..&p=..", or a bare code
    let s=input.trim();
    if(!s) return null;
    const hashIdx=s.indexOf('#');
    if(hashIdx>=0) s=s.slice(hashIdx+1);
    if(s.includes('=')){
      const q=new URLSearchParams(s);
      const p=q.get('p'); if(!p) return null;
      return {name:(q.get('n')||'').slice(0,40)||'(unnamed)', code:normalizeCode(p)};
    }
    return {name:'(unnamed)', code:normalizeCode(s)};
  }
  function normalizeCode(p){
    // Convert legacy long form to compact for storage
    if(/^[01-]+$/.test(p)&&p.length>12){
      const tmp=decodePicks(p).picks;
      const bytes=new Uint8Array(8);
      for(let i=0;i<ORDER.length;i++){
        const v=tmp[ORDER[i]]===0?1:tmp[ORDER[i]]===1?2:0;
        bytes[i>>2]|=v<<((i&3)*2);
      }
      return B64U.enc(bytes);
    }
    return p;
  }

  function save(){
    // Bracket mode with nothing set → keep the URL bare.
    if(mode==="bracket" && !bracketName && bracketTB==null && !Object.keys(picks).length){
      history.replaceState(null,"",location.pathname);
      return;
    }
    const q=new URLSearchParams();
    if(mode==="compare"){
      q.set("v","cmp");
      // Only encode entries into the URL for ad-hoc comparisons; the canonical
      // pool loads from pool.json and keeps the URL short.
      if(cmpEntries.length && !cmpFromPool){
        q.set("b",cmpEntries.map(e=>encodeURIComponent(e.name)+"~"+e.code).join("!"));
      }
    } else {
      if(bracketName) q.set("n",bracketName);
      q.set("p",encodePicks(bracketTB));
    }
    history.replaceState(null,"","#"+q.toString());
  }
  function load(){
    if(!location.hash) return;
    try{
      const q=new URLSearchParams(location.hash.slice(1));
      if(q.get("v")==="cmp"){
        mode="compare";
        const b=q.get("b");
        if(b){
          cmpEntries=b.split("!").map(part=>{
            const i=part.indexOf("~");
            return i<0?null:{name:decodeURIComponent(part.slice(0,i))||'(unnamed)',code:part.slice(i+1)};
          }).filter(Boolean);
          cmpFromPool=false;
        }
        // If no &b=, pool.json is loaded lazily when the tab renders.
      } else {
        bracketName=q.get("n")||"";
        const d=decodePicks(q.get("p"));
        picks=d.picks; bracketTB=d.tb;
      }
    }catch(e){}
  }

  function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

  function teamRow(id,idx,code,state){
    let cls="team";
    if(!code) cls+=" empty";
    if(state.picked) cls+=" picked";
    if(state.wrongPick) cls+=" wrong-pick";
    if(state.actualWinner) cls+=" actual";
    if(state.eliminated) cls+=" eliminated";
    const d=el("div",cls);
    if(code){
      const t=TEAMS[code];
      let html='<span class="flag">'+t.f+'</span><span class="team-name">'+t.n+'</span>';
      if(state.goals!=null){
        html+='<span class="goals">'+state.goals+'</span>';
        if(state.pens!=null) html+='<span class="pens">('+state.pens+')</span>';
      }
      d.innerHTML=html;
      if(!state.locked) d.onclick=()=>setPick(id,idx);
    } else {
      const s=MATCHES[id].s[idx];
      const lbl=s.w?"Winner M"+s.w:s.l?"Loser M"+s.l:"—";
      d.innerHTML='<span class="flag"></span><span class="team-name">'+lbl+'</span>';
    }
    return d;
  }

  function matchCard(id,extraCls){
    const shown=slotTeams(id,displaySrc());
    const sc=SCORES[id];
    const done=RESULTS[id]!=null;
    const live=sc&&sc.status==="LIVE";
    const myWin=picks[id]!=null?winnerOf(id,mySrc()):null;
    const realWin=done?winnerOf(id,RESULTS):null;
    const verdict = myWin
      ? (done ? (myWin===realWin?"correct":"wrong")
              : (isDead(id,myWin)?"wrong":null))
      : null;

    const c=el("div","match"+(done?" done":"")+(live?" live":"")+(extraCls?" "+extraCls:""));
    c.appendChild(el("span","match-tag","M"+id));
    for(let i=0;i<2;i++){
      const isMyPickRow = picks[id]===i && shown[i]===myWin;
      c.appendChild(teamRow(id,i,shown[i],{
        picked: isMyPickRow,
        actualWinner: done && RESULTS[id]===i,
        eliminated: done && RESULTS[id]!==i,
        locked: done,
        wrongPick: isMyPickRow && verdict==="wrong",
        goals: sc?sc.score[i]:null,
        pens: sc&&sc.pens?sc.pens[i]:null
      }));
    }
    if(live){
      c.appendChild(el("span","live-badge","LIVE "+(sc.minute||"")));
    } else if(verdict){
      c.appendChild(el("span","verdict "+verdict, verdict==="correct"?"✓":"✕"));
    }
    // Caption: if I predicted a team that isn't even in this real matchup, note it; else show date/venue.
    if(myWin && shown.indexOf(myWin)===-1){
      c.appendChild(el("span","miss-note","you had "+TEAMS[myWin].n));
    } else {
      c.appendChild(el("span","match-date",MATCHES[id].d));
    }
    return c;
  }
  function column(ids,cls,label){
    const col=el("div","col "+cls);
    col.appendChild(el("div","round-label",label));
    for(const id of ids) col.appendChild(matchCard(id));
    return col;
  }
  function side(half,which){
    const s=el("div","side "+which);
    s.appendChild(column(half.r32,"r32","Round of 32"));
    s.appendChild(column(half.r16,"r16","Round of 16"));
    s.appendChild(column(half.qf,"qf","Quarterfinal"));
    s.appendChild(column(half.sf,"sf","Semifinal"));
    return s;
  }
  function center(){
    const c=el("div","center");
    c.appendChild(el("div","center-label final-label","Final"));
    c.appendChild(matchCard(104,"final"));
    const champ=winnerOf(104,displaySrc());
    const box=el("div","champion"+(champ?" filled":""));
    box.innerHTML='<div class="champion-label">🏆 Champion</div><div class="champion-team">'+
      (champ?'<span class="flag">'+TEAMS[champ].f+'</span><span>'+TEAMS[champ].n+'</span>':'<span style="color:var(--muted);font-weight:400;font-size:13px">—</span>')+
      '</div>';
    c.appendChild(box);
    // Tiebreaker input sits between Champion and Third Place.
    const locked=finalStarted();
    const tbBox=el("div","tb-box"+(locked?" locked":""));
    if(locked){
      tbBox.innerHTML='<div class="lbl">Tiebreaker <span style="font-weight:400">· locked</span></div>'+
        '<div class="tb-value">'+(bracketTB==null?'—':bracketTB)+'</div>'+
        '<div class="hint">goals + corners + yellows in the Final'+
        (TB_ACTUAL!=null?' · actual <b>'+TB_ACTUAL+'</b>':'')+'</div>';
    } else {
      tbBox.innerHTML='<div class="lbl">Tiebreaker</div>'+
        '<input type="number" id="bracket-tb" min="0" max="99" placeholder="?">'+
        '<div class="hint">goals + corners + yellows in the Final · locks at kickoff</div>';
      const tbInput=tbBox.querySelector('input');
      tbInput.value=bracketTB==null?"":bracketTB;
      tbInput.oninput=e=>{
        const v=e.target.value.trim();
        bracketTB=v===""?null:Math.max(0,Math.min(99,+v|0));
        save();
      };
    }
    c.appendChild(tbBox);
    const tb=el("div","third-block");
    tb.appendChild(el("div","center-label","Third Place"));
    tb.appendChild(matchCard(103));
    c.appendChild(tb);
    return c;
  }

  const root=document.getElementById("bracket");
  function render(){
    root.innerHTML="";
    root.appendChild(side(LEFT,"left"));
    root.appendChild(center());
    root.appendChild(side(RIGHT,"right"));
    // progress + score
    let nPicks=0, nDone=0, nCorrect=0;
    const ms=mySrc();
    for(const id of ORDER){
      if(picks[id]!=null) nPicks++;
      if(RESULTS[id]!=null && picks[id]!=null){
        const my=winnerOf(id,ms);
        if(my){ nDone++; if(my===winnerOf(id,RESULTS)) nCorrect++; }
      }
    }
    document.getElementById("progress").textContent=nPicks+" / 32 picks";
    document.getElementById("score").innerHTML="Score <b>"+nCorrect+"</b>/"+nDone;
    document.getElementById("score").style.display=nDone?"":"none";
    document.getElementById("bracket-name").value=bracketName;
  }

  document.getElementById("bracket-name").oninput=e=>{bracketName=e.target.value;save();};
  let tipTimer=null;
  document.getElementById("share-btn").onclick=()=>{
    save();
    const tip=document.getElementById("copy-tip");
    const done=()=>{
      tip.classList.add("show");
      clearTimeout(tipTimer);
      tipTimer=setTimeout(()=>tip.classList.remove("show"),1800);
    };
    const url=cleanUrl();
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(()=>prompt("Copy this link:",url));
    else prompt("Copy this link:",url);
  };
  document.getElementById("reset-btn").onclick=()=>{
    if(Object.keys(picks).length&&!confirm("Clear all picks?"))return;
    picks={};save();render();
  };

  // ---- Compare view --------------------------------------------------
  const ROUND_IDS={
    "R32":[73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88],
    "R16":[89,90,91,92,93,94,95,96],
    "QF":[97,98,99,100],
    "SF":[101,102],
    "3rd":[103],
    "Final":[104]
  };
  function scoreBracket(px){
    // px = that person's picks object
    const src=Object.assign({},RESULTS,px);
    const perRound={}; let total=0,correct=0;
    for(const [rd,ids] of Object.entries(ROUND_IDS)){
      let rc=0,rt=0;
      for(const id of ids){
        if(RESULTS[id]==null||px[id]==null) continue;
        const my=winnerOf(id,src); if(!my) continue;
        rt++; total++;
        if(my===winnerOf(id,RESULTS)){rc++;correct++;}
      }
      perRound[rd]={c:rc,t:rt};
    }
    const champ=winnerOf(104,src);
    return {correct,total,perRound,champ};
  }

  // Render one person's bracket as a compact mini-bracket. Each cell shows
  // that person's predicted winner, colored by verdict.
  function miniCell(id,px,src){
    const my=px[id]!=null?winnerOf(id,src):null;
    const done=RESULTS[id]!=null;
    if(my){
      let cls;
      if(done) cls='m '+(my===winnerOf(id,RESULTS)?'correct':'wrong');
      else if(isDead(id,my)) cls='m wrong';   // team can no longer reach this match
      else cls='m pending';
      const t=TEAMS[my];
      return '<div class="'+cls+'" title="M'+id+': picked '+t.n+'"><span class="flag">'+t.f+'</span><span class="nm">'+t.n+'</span></div>';
    }
    // No pick — show what's actually there, greyed out.
    const actual=done?winnerOf(id,RESULTS):null;
    if(actual){
      const t=TEAMS[actual];
      return '<div class="m none filled" title="M'+id+': no pick — '+t.n+' won"><span class="flag">'+t.f+'</span><span class="nm">'+t.n+'</span></div>';
    }
    // Not yet played — show the matchup flags if both participants are known.
    const st=slotTeams(id,RESULTS);
    if(st[0]&&st[1]){
      return '<div class="m none filled" title="M'+id+': no pick — '+TEAMS[st[0]].n+' v '+TEAMS[st[1]].n+'">'+
        '<span class="vs">'+TEAMS[st[0]].f+' v '+TEAMS[st[1]].f+'</span></div>';
    }
    return '<div class="m none" title="M'+id+' — no pick">·</div>';
  }
  function miniCol(ids,cls,px,src){
    return '<div class="col '+cls+'">'+ids.map(id=>miniCell(id,px,src)).join('')+'</div>';
  }
  function miniSide(half,which,px,src){
    return '<div class="side '+which+'">'+
      miniCol(half.r32,'r32',px,src)+
      miniCol(half.r16,'r16',px,src)+
      miniCol(half.qf,'qf',px,src)+
      miniCol(half.sf,'sf',px,src)+
    '</div>';
  }
  function miniVerdictCell(id,px,src,extraCls){
    const my=px[id]!=null?winnerOf(id,src):null;
    const done=RESULTS[id]!=null;
    let cls='m '+(extraCls||'');
    if(!my) cls+=' none';
    else if(done) cls+=(my===winnerOf(id,RESULTS))?' correct':' wrong';
    else if(isDead(id,my)) cls+=' wrong';
    else cls+=' pending';
    if(!my) return '<div class="'+cls+'">—</div>';
    const t=TEAMS[my];
    return '<div class="'+cls+'" title="M'+id+': picked '+t.n+'"><span class="flag">'+t.f+'</span><span class="nm">'+t.n+'</span></div>';
  }
  function miniBracket(px,src){
    return '<div class="mini-scroll"><div class="mini">'+
      miniSide(LEFT,'left',px,src)+
      '<div class="center">'+
        '<div class="lbl champ-lbl">Champion</div>'+
        miniVerdictCell(104,px,src,'champ')+
        '<div class="lbl third-lbl">3rd Place</div>'+
        miniVerdictCell(103,px,src,'third')+
      '</div>'+
      miniSide(RIGHT,'right',px,src)+
    '</div></div>';
  }

  function switchToCustom(){
    cmpFromPool=false; cmpEntries=[]; save(); renderCompare();
  }
  function switchToPool(){
    cmpFromPool=true; cmpEntries=[]; save(); renderCompare();
    fetchPool().then(renderCompare);
  }
  function renderCompare(){
    const body=document.getElementById("compare-body");
    document.querySelector('.add-row').style.display=cmpFromPool?"none":"";
    if(!cmpEntries.length){
      const hdr=cmpFromPool
        ? '<div class="pool-hdr"><div><h2 class="pool-title">'+escapeHtml(POOL_TITLE)+'</h2>'+
          '<div class="pool-sub">Loading pool…</div></div>'+
          '<button class="link-btn" id="go-custom">build a custom comparison →</button></div>'
        : '<div class="pool-hdr"><div><h2 class="pool-title">Custom comparison</h2>'+
          '<div class="pool-sub">Paste bracket links above to compare</div></div>'+
          '<button class="link-btn" id="go-pool">← back to '+escapeHtml(POOL_TITLE)+'</button></div>'+
          '<div class="cmp-empty">No brackets yet — paste a link above.</div>';
      body.innerHTML=hdr;
      wireCompareButtons(body);
      return;
    }
    // Score every entry. Tiebreaker guess is decoded from the code itself.
    const rows=cmpEntries.map((e,idx)=>{
      const d=decodePicks(e.code);
      const px=d.picks, tb=d.tb;
      const s=scoreBracket(px);
      const tbDiff=(TB_ACTUAL!=null&&tb!=null)?Math.abs(tb-TB_ACTUAL):null;
      return {idx,name:e.name,code:e.code,tb,tbDiff,px,src:Object.assign({},RESULTS,px),...s};
    });
    // Sealed-bid: hide guesses until the Final kicks off.
    const tbUnlocked=finalStarted();
    // Tiebreaker bonus: only applies to break a FIRST-PLACE TIE. Among people
    // tied on the top base score, the closest guess gets +1. If someone is
    // already alone at #1, no bonus is awarded to anyone.
    for(const r of rows){ r.tbBonus=0; r.pts=r.correct; }
    if(TB_ACTUAL!=null && rows.length){
      const topScore=Math.max(...rows.map(r=>r.correct));
      const leaders=rows.filter(r=>r.correct===topScore);
      if(leaders.length>1){
        let best=null;
        for(const r of leaders) if(r.tbDiff!=null) best=best==null?r.tbDiff:Math.min(best,r.tbDiff);
        if(best!=null){
          for(const r of leaders) if(r.tbDiff===best){ r.tbBonus=1; r.pts=r.correct+1; }
        }
      }
    }
    rows.sort((a,b)=>
      b.pts-a.pts ||
      b.correct-a.correct ||
      b.total-a.total ||
      a.name.localeCompare(b.name)
    );
    // Tournament over + pool view → celebrate the winner (once per page load).
    if(cmpFromPool && RESULTS[104]!=null && rows.length){
      celebrate(rows[0]);
    }

    // ---- Leaderboard ----
    let html='';
    if(cmpFromPool){
      html+='<div class="pool-hdr"><div>'+
              '<h2 class="pool-title">'+escapeHtml(POOL_TITLE)+'</h2>'+
              '<div class="pool-sub">'+cmpEntries.length+' brackets · click a row to view it in the editor</div>'+
            '</div>'+
            '<button class="link-btn" id="go-custom">build a custom comparison →</button>'+
            '</div>';
    } else {
      html+='<div class="pool-hdr"><div>'+
              '<h2 class="pool-title">Custom comparison</h2>'+
              '<div class="pool-sub">Paste bracket links to compare — this list is encoded in the URL</div>'+
            '</div>'+
            '<button class="link-btn" id="go-pool">← back to '+escapeHtml(POOL_TITLE)+'</button>'+
            '</div>';
    }
    const tbHdr='<th title="Tiebreaker (worth +1 pt to the closest guess): goals + corners + yellows in the Final">'
      +'Tiebreak'
      +(TB_ACTUAL!=null?' <span style="font-weight:400">(actual '+TB_ACTUAL+')</span>':'')
      +(!tbUnlocked?' <span style="font-weight:400">🔒</span>':'')
      +'</th>';
    html+='<table class="leaderboard"><thead><tr>'+
      '<th class="rank">#</th><th>Name</th><th>Score</th><th>Champion Pick</th>'+
      tbHdr+'<th>By round</th>'+(cmpFromPool?'':'<th></th>')+'</tr></thead><tbody>';
    rows.forEach((r,i)=>{
      const rounds=Object.entries(r.perRound).filter(([,v])=>v.t>0)
        .map(([k,v])=>k+' '+v.c+'/'+v.t).join(' · ')||'—';
      const scoreCell=r.tbBonus
        ? '<b>'+r.pts+'</b> <span class="tb-diff" title="tiebreaker bonus">(+1)</span> / '+r.total
        : '<b>'+r.pts+'</b> / '+r.total;
      let tbCell;
      if(r.tb==null) tbCell='<span style="color:var(--muted)">—</span>';
      else if(!tbUnlocked) tbCell='<span style="color:var(--muted)" title="Hidden until the Final kicks off">🔒</span>';
      else tbCell='<b>'+r.tb+'</b>'+(r.tbDiff!=null?' <span class="tb-diff">Δ'+r.tbDiff+'</span>':'');
      html+='<tr data-edit="'+r.idx+'" title="Click to open this bracket in the editor"><td class="rank">'+(i+1)+'</td>'+
        '<td class="lb-name">'+escapeHtml(r.name)+'</td>'+
        '<td class="lb-score">'+scoreCell+'</td>'+
        '<td><span class="lb-champ">'+(r.champ?'<span class="flag">'+TEAMS[r.champ].f+'</span>'+TEAMS[r.champ].n:'<span style="color:var(--muted)">—</span>')+'</span></td>'+
        '<td class="lb-tb">'+tbCell+'</td>'+
        '<td class="rounds">'+rounds+'</td>'+
        (cmpFromPool?'':'<td><button class="rm" data-rm="'+r.idx+'" title="Remove">×</button></td>')+'</tr>';
    });
    html+='</tbody></table>';

    // ---- Mini bracket per person ----
    html+='<div class="mini-list">';
    rows.forEach((r,i)=>{
      html+='<div class="mini-card">'+
        '<div class="mini-hdr">'+
          '<span class="nm">#'+(i+1)+' · '+escapeHtml(r.name)+'</span>'+
          '<span class="sc"><b>'+r.pts+'</b> / '+r.total+(r.tbBonus?' <span style="color:var(--gold)">+1 tb</span>':'')+'</span>'+
          '<span class="ch">Champion: '+(r.champ?'<span class="flag">'+TEAMS[r.champ].f+'</span> '+TEAMS[r.champ].n:'—')+'</span>'+
        '</div>'+
        miniBracket(r.px,r.src)+
      '</div>';
    });
    html+='</div>';
    body.innerHTML=html;
    wireCompareButtons(body);
  }
  function wireCompareButtons(body){
    body.querySelectorAll('.rm').forEach(b=>b.onclick=ev=>{
      ev.stopPropagation();
      cmpEntries.splice(+b.dataset.rm,1); save(); renderCompare();
    });
    body.querySelectorAll('.leaderboard tbody tr').forEach(tr=>{
      tr.onclick=()=>editEntry(+tr.dataset.edit);
    });
    const gc=body.querySelector('#go-custom'); if(gc) gc.onclick=switchToCustom;
    const gp=body.querySelector('#go-pool');   if(gp) gp.onclick=switchToPool;
  }
  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  // ---- Celebration ---------------------------------------------------
  let celebrated=false;
  function celebrate(winner){
    if(celebrated) return; celebrated=true;
    const ov=el('div','celebrate');
    ov.innerHTML='<div class="banner">'+
      '<div class="trophy">🏆</div>'+
      '<div class="congrats">Pool Champion</div>'+
      '<div class="winner">'+escapeHtml(winner.name)+'</div>'+
      '<div class="sub"><b>'+winner.pts+'</b> / '+winner.total+' · bach to the future</div>'+
      '<button class="close">Nice</button>'+
    '</div>';
    document.body.appendChild(ov);
    const canvas=el('canvas'); canvas.id='confetti';
    document.body.appendChild(canvas);
    const stop=startConfetti(canvas);
    const dismiss=()=>{
      ov.classList.add('out');
      setTimeout(()=>{ov.remove();canvas.remove();stop();},300);
    };
    ov.querySelector('.close').onclick=dismiss;
    setTimeout(dismiss,14000);
  }
  function startConfetti(canvas){
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ctx=canvas.getContext('2d');
    const dpr=Math.min(devicePixelRatio||1,2);
    let W,H;
    const resize=()=>{W=canvas.width=innerWidth*dpr;H=canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';};
    resize(); addEventListener('resize',resize);
    const colors=['#ffb700','#1e6b3a','#b3261e','#2e7dd7','#d95f9c','#f4f1e3'];
    const N=reduce?0:160;
    const parts=[];
    // Two side cannons only — staggered launch so the burst lasts.
    for(let i=0;i<N;i++){
      const left=i%2===0;
      const x=left?0:W, y=H*0.62;
      const vx=(left?1:-1)*(5+Math.random()*7)*dpr;
      const vy=(-11-Math.random()*7)*dpr;
      parts.push({x,y,vx,vy,
        w:(5+Math.random()*5)*dpr,
        h:(14+Math.random()*18)*dpr,          // longer streamers
        rot:Math.random()*Math.PI,vr:(Math.random()-.5)*0.25,
        color:colors[i%colors.length],
        wobble:Math.random()*Math.PI*2,
        delay:Math.floor(Math.random()*45)});  // 0-45 frames stagger
    }
    let running=true, tick=0;
    const g=0.18*dpr, drag=0.994, termV=3.2*dpr;   // lighter gravity + terminal velocity → linger
    function frame(){
      if(!running) return;
      tick++;
      ctx.clearRect(0,0,W,H);
      for(const p of parts){
        if(tick<p.delay) continue;
        p.vy=Math.min(p.vy+g,termV); p.vx*=drag;
        p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.wobble+=0.09;
        const sx=Math.cos(p.wobble);
        ctx.save();
        ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.scale(sx,1);
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    if(N) requestAnimationFrame(frame);
    return ()=>{running=false;removeEventListener('resize',resize);};
  }

  // ---- Tab switching --------------------------------------------------
  function setMode(m){
    mode=m;
    document.getElementById("tab-bracket").classList.toggle("active",m==="bracket");
    document.getElementById("tab-compare").classList.toggle("active",m==="compare");
    document.getElementById("view-bracket").classList.toggle("active",m==="bracket");
    document.getElementById("view-compare").classList.toggle("active",m==="compare");
    document.getElementById("bracket-controls").style.display=m==="bracket"?"":"none";
    document.getElementById("compare-controls").style.display=m==="compare"?"":"none";
    document.getElementById("subtitle").textContent=m==="compare"
      ?"Paste bracket links to rank them and compare picks match-by-match."
      :"Click a team to advance them. Picks are saved in the URL — copy the link to share.";
    save();
    if(m==="compare"){
      // No URL-supplied entries → load the canonical pool.
      if(!cmpEntries.length && !cmpFromPool){
        cmpFromPool=true;
        renderCompare();               // shows "Loading pool…"
        fetchPool().then(renderCompare);
      } else {
        renderCompare();
      }
    } else {
      render();
    }
  }
  document.getElementById("tab-bracket").onclick=()=>setMode("bracket");
  document.getElementById("tab-compare").onclick=()=>setMode("compare");

  function addEntry(ref){
    if(!ref)return;
    if(cmpEntries.length>=12){alert("Max 12 brackets");return;}
    cmpEntries.push(ref); save(); renderCompare();
  }
  document.getElementById("add-btn").onclick=()=>{
    const inp=document.getElementById("add-url");
    const ref=parseBracketRef(inp.value);
    if(ref){addEntry(ref);inp.value="";}
  };
  document.getElementById("add-url").onkeydown=e=>{
    if(e.key==="Enter"){document.getElementById("add-btn").click();}
  };
  document.getElementById("add-mine-btn").onclick=()=>{
    if(!Object.keys(picks).length){alert("Your bracket is empty — make some picks on the My Bracket tab first.");return;}
    addEntry({name:bracketName||"Me",code:encodePicks(bracketTB)});
  };
  document.getElementById("share-cmp-btn").onclick=()=>{
    save();
    const tip=document.getElementById("copy-tip-cmp");
    const done=()=>{tip.classList.add("show");setTimeout(()=>tip.classList.remove("show"),1800);};
    const url=cleanUrl();
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(()=>prompt("Copy this link:",url));
    else prompt("Copy this link:",url);
  };

  // Load a compared bracket into the editor and switch to My Bracket tab.
  function editEntry(idx){
    const e=cmpEntries[idx]; if(!e) return;
    if(Object.keys(picks).length && encodePicks(bracketTB)!==e.code){
      if(!confirm('Load "'+e.name+'" into the editor? This replaces the bracket currently on the My Bracket tab.')) return;
    }
    const d=decodePicks(e.code);
    picks=d.picks; bracketTB=d.tb;
    bracketName=e.name==='(unnamed)'?'':e.name;
    setMode("bracket");
  }

  // ---- Boot ----------------------------------------------------------
  load();
  setMode(mode);           // render immediately (scores may arrive after)
  fetchScores();           // fetch ESPN (or fallback) + re-render
  setInterval(fetchScores,60000);   // poll every 60s
})();
</script>
