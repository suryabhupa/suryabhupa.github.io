<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>World Cup 2026 — Knockout Bracket Predictor</title>
<style>
  :root {
    --bg: #f7f1e3;
    --card: #ffffff;
    --line: #d8ceb4;
    --connector: #bdb293;
    --text: #2e2812;
    --muted: #93875f;
    --pick: #1e6b3a;
    --pick-bg: #e7f2eb;
    --gold: #b8860b;
    --gold-bg: #fdf5e0;
    --correct: #1e6b3a;
    --wrong: #b3261e;
    --wrong-bg: #fbeae9;

    --match-h: 64px;
    --bracket-h: 744px;        /* 8 R32 matches space-around → 93px per slot */
    --col-w: 184px;
    --gap: 36px;
    --stub: 18px;              /* half of gap */
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { font-size: 12px; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
  input[type="text"] {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font: inherit; font-size: 13px; width: 180px;
  }
  input[type="text"]:focus { outline: 2px solid var(--pick); outline-offset: -1px; }
  button {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 7px 12px; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  button:hover { background: #fdfbf4; border-color: var(--connector); }
  button:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }
  button.primary { background: var(--pick); border-color: var(--pick); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  .progress { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- Bracket layout ------------------------------------------------ */
  .bracket-scroll { overflow-x: auto; padding: 36px 24px 28px; }
  .bracket {
    display: flex; align-items: center; gap: var(--gap);
    min-width: min-content; margin: 0 auto; width: fit-content;
  }
  .side { display: flex; gap: var(--gap); align-items: stretch; }
  .side.right { flex-direction: row-reverse; }

  .col {
    display: flex; flex-direction: column; justify-content: space-around;
    width: var(--col-w); height: var(--bracket-h); position: relative;
  }
  .round-label {
    position: absolute; top: -20px; left: 0; right: 0;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); text-align: center;
  }

  /* ---- Match card ---------------------------------------------------- */
  .match {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    height: var(--match-h); display: flex; flex-direction: column;
    position: relative; box-shadow: 0 1px 2px rgba(46,40,18,0.06);
  }
  .team {
    flex: 1; display: flex; align-items: center; gap: 7px; padding: 0 9px;
    cursor: pointer; font-size: 13px; font-weight: 500; user-select: none;
    border-left: 3px solid transparent;
  }
  .side.right .team { border-left: none; border-right: 3px solid transparent; }
  .team + .team { border-top: 1px solid var(--line); }
  .team:hover { background: #fbf7ec; }
  .team.empty { color: var(--muted); font-size: 11px; font-weight: 400; cursor: default; font-style: italic; }
  .team.empty:hover { background: transparent; }
  .team.picked { background: var(--pick-bg); border-left-color: var(--pick); color: var(--pick); font-weight: 600; }
  .side.right .team.picked { border-right-color: var(--pick); }
  .team.picked:hover { background: #dbeee2; }
  .flag { font-size: 16px; line-height: 1; width: 20px; text-align: center; flex-shrink: 0; }
  .team-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match-tag {
    position: absolute; top: -7px; font-size: 9px; color: var(--muted);
    background: var(--bg); padding: 0 4px; font-variant-numeric: tabular-nums;
    border-radius: 3px;
  }
  .side.left .match-tag, .center .match-tag { left: 6px; }
  .side.right .match-tag { right: 6px; }
  .match-date {
    position: absolute; top: calc(100% + 3px); left: 2px; right: 2px;
    font-size: 10px; font-style: italic; color: var(--muted);
    line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }
  .side.right .match-date { text-align: right; }

  /* ---- Results & scoring -------------------------------------------- */
  .match.done .team { cursor: default; }
  .match.done .team:hover { background: transparent; }
  .match.done .team.picked:hover { background: var(--pick-bg); }
  .team.actual { font-weight: 700; }
  .team.actual::after {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--text); margin-left: 4px; flex-shrink: 0;
  }
  .team.eliminated .team-name { opacity: 0.5; text-decoration: line-through; text-decoration-thickness: 1px; }
  .verdict {
    position: absolute; top: -8px; width: 16px; height: 16px; border-radius: 50%;
    font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; color: #fff;
    z-index: 1;
  }
  .side.left .verdict, .center .verdict { right: -6px; }
  .side.right .verdict { left: -6px; }
  .verdict.correct { background: var(--correct); }
  .verdict.wrong { background: var(--wrong); }
  .match.done .team.picked.wrong-pick { background: var(--wrong-bg); border-left-color: var(--wrong); color: var(--wrong); }
  .side.right .match.done .team.picked.wrong-pick { border-right-color: var(--wrong); }
  .miss-note {
    position: absolute; top: calc(100% + 3px); left: 2px; right: 2px;
    font-size: 9px; font-style: italic; color: var(--wrong);
    line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side.right .miss-note { text-align: right; }
  .score {
    font-size: 12px; font-weight: 600; color: var(--text);
    padding: 4px 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; font-variant-numeric: tabular-nums;
  }
  .score b { color: var(--correct); }

  /* ---- Connectors ---------------------------------------------------- */
  /* Per-round vertical connector heights = bracket-h / (2 × matches in prev round) × 2
     i.e. distance between adjacent prev-round match centers.               */
  .col.r16 { --vline: calc(var(--bracket-h) / 8); }   /* 82px  */
  .col.qf  { --vline: calc(var(--bracket-h) / 4); }   /* 164px */
  .col.sf  { --vline: calc(var(--bracket-h) / 2); }   /* 328px */

  /* Output stub from every match toward the center */
  .side .match::after {
    content: ""; position: absolute; width: var(--stub); height: 2px;
    background: var(--connector); top: calc(50% - 1px);
  }
  .side.left  .match::after { left: 100%; }
  .side.right .match::after { right: 100%; }

  /* Input bracket on receiving matches: vertical line + center stub */
  .side .col.r16 .match::before,
  .side .col.qf  .match::before,
  .side .col.sf  .match::before {
    content: ""; position: absolute; width: var(--stub); height: var(--vline);
    top: calc(50% - var(--vline) / 2);
    background: linear-gradient(var(--connector),var(--connector)) center/100% 2px no-repeat;
  }
  .side.left  .col.r16 .match::before,
  .side.left  .col.qf  .match::before,
  .side.left  .col.sf  .match::before { right: 100%; border-left: 2px solid var(--connector); }
  .side.right .col.r16 .match::before,
  .side.right .col.qf  .match::before,
  .side.right .col.sf  .match::before { left: 100%; border-right: 2px solid var(--connector); }

  /* SF → Final: straight line into the center column from both sides */
  .center .final::before, .center .final::after {
    content: ""; position: absolute; width: var(--gap); height: 2px;
    background: var(--connector); top: calc(50% - 1px);
  }
  .center .final::before { right: 100%; }
  .center .final::after  { left: 100%; }

  /* ---- Center column ------------------------------------------------- */
  .center { width: 208px; height: var(--bracket-h); position: relative; }
  .center-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); text-align: center;
  }
  .center .final {
    position: absolute; left: 0; right: 0;
    top: calc(50% - var(--match-h) / 2);
  }
  .final-label { position: absolute; left: 0; right: 0; top: calc(50% - var(--match-h) / 2 - 22px); }
  .champion {
    position: absolute; left: 0; right: 0; top: calc(50% + var(--match-h) / 2 + 24px);
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: 12px; text-align: center;
  }
  .champion.filled { border-color: var(--gold); background: var(--gold-bg); }
  .champion-label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .champion.filled .champion-label { color: var(--gold); }
  .champion-team { font-size: 16px; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .champion.filled .champion-team { color: var(--gold); }
  .third-block { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column; gap: 8px; }

  /* ---- Copy-link popup ---------------------------------------------- */
  .share-wrap { position: relative; display: inline-block; }
  .copy-tip {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(4px);
    background: var(--text); color: var(--bg);
    padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: 600;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .copy-tip::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--text);
  }
  .copy-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .copy-tip { transition: none; } }
</style>

<header>
  <div>
    <h1>FIFA World Cup 2026 · Knockout Predictor</h1>
    <div class="sub">Click a team to advance them. Picks are saved in the URL — copy the link to share.</div>
  </div>
  <div class="controls">
    <span class="score" id="score" title="Correct predictions on completed matches">Score <b>0</b>/0</span>
    <span class="progress" id="progress">0 / 32</span>
    <input type="text" id="bracket-name" placeholder="Bracket name" maxlength="40">
    <span class="share-wrap">
      <button class="primary" id="share-btn">Copy share link</button>
      <span class="copy-tip" id="copy-tip">Link copied!</span>
    </span>
    <button id="reset-btn">Reset</button>
  </div>
</header>

<div class="bracket-scroll">
  <div class="bracket" id="bracket"></div>
</div>

<script>
(function() {
  const TEAMS = {
    RSA:{n:"South Africa",f:"🇿🇦"}, CAN:{n:"Canada",f:"🇨🇦"},
    BRA:{n:"Brazil",f:"🇧🇷"}, JPN:{n:"Japan",f:"🇯🇵"},
    GER:{n:"Germany",f:"🇩🇪"}, PAR:{n:"Paraguay",f:"🇵🇾"},
    NED:{n:"Netherlands",f:"🇳🇱"}, MAR:{n:"Morocco",f:"🇲🇦"},
    CIV:{n:"Ivory Coast",f:"🇨🇮"}, NOR:{n:"Norway",f:"🇳🇴"},
    FRA:{n:"France",f:"🇫🇷"}, SWE:{n:"Sweden",f:"🇸🇪"},
    MEX:{n:"Mexico",f:"🇲🇽"}, ECU:{n:"Ecuador",f:"🇪🇨"},
    ENG:{n:"England",f:"🏴󠁧󠁢󠁥󠁮󠁧󠁿"}, COD:{n:"DR Congo",f:"🇨🇩"},
    BEL:{n:"Belgium",f:"🇧🇪"}, SEN:{n:"Senegal",f:"🇸🇳"},
    USA:{n:"United States",f:"🇺🇸"}, BIH:{n:"Bosnia & Herz.",f:"🇧🇦"},
    ESP:{n:"Spain",f:"🇪🇸"}, AUT:{n:"Austria",f:"🇦🇹"},
    POR:{n:"Portugal",f:"🇵🇹"}, CRO:{n:"Croatia",f:"🇭🇷"},
    SUI:{n:"Switzerland",f:"🇨🇭"}, ALG:{n:"Algeria",f:"🇩🇿"},
    AUS:{n:"Australia",f:"🇦🇺"}, EGY:{n:"Egypt",f:"🇪🇬"},
    ARG:{n:"Argentina",f:"🇦🇷"}, CPV:{n:"Cape Verde",f:"🇨🇻"},
    COL:{n:"Colombia",f:"🇨🇴"}, GHA:{n:"Ghana",f:"🇬🇭"}
  };

  // d = "date, time · city" (local kickoff). Times TBD for R16 onward.
  const MATCHES = {
    73:{d:"Jun 28, 12:00 · Los Angeles",s:[{t:"RSA"},{t:"CAN"}]},
    74:{d:"Jun 29, 16:30 · Boston",s:[{t:"GER"},{t:"PAR"}]},
    75:{d:"Jun 29, 19:00 · Monterrey",s:[{t:"NED"},{t:"MAR"}]},
    76:{d:"Jun 29, 12:00 · Houston",s:[{t:"BRA"},{t:"JPN"}]},
    77:{d:"Jun 30, 17:00 · New York/NJ",s:[{t:"FRA"},{t:"SWE"}]},
    78:{d:"Jun 30, 12:00 · Dallas",s:[{t:"CIV"},{t:"NOR"}]},
    79:{d:"Jun 30, 19:00 · Mexico City",s:[{t:"MEX"},{t:"ECU"}]},
    80:{d:"Jul 1, 12:00 · Atlanta",s:[{t:"ENG"},{t:"COD"}]},
    81:{d:"Jul 1, 13:00 · Bay Area",s:[{t:"USA"},{t:"BIH"}]},
    82:{d:"Jul 1, 17:00 · Seattle",s:[{t:"BEL"},{t:"SEN"}]},
    83:{d:"Jul 2, 19:00 · Toronto",s:[{t:"POR"},{t:"CRO"}]},
    84:{d:"Jul 2, 12:00 · Los Angeles",s:[{t:"ESP"},{t:"AUT"}]},
    85:{d:"Jul 2, 20:00 · Vancouver",s:[{t:"SUI"},{t:"ALG"}]},
    86:{d:"Jul 3, 13:00 · Miami",s:[{t:"ARG"},{t:"CPV"}]},
    87:{d:"Jul 3, 18:00 · Kansas City",s:[{t:"COL"},{t:"GHA"}]},
    88:{d:"Jul 3, 20:30 · Dallas",s:[{t:"AUS"},{t:"EGY"}]},
    89:{d:"Jul 4 · Philadelphia",s:[{w:74},{w:77}]},
    90:{d:"Jul 4 · Houston",s:[{w:73},{w:75}]},
    91:{d:"Jul 5 · New York/NJ",s:[{w:76},{w:78}]},
    92:{d:"Jul 5 · Mexico City",s:[{w:79},{w:80}]},
    93:{d:"Jul 6 · Dallas",s:[{w:83},{w:84}]},
    94:{d:"Jul 6 · Seattle",s:[{w:81},{w:82}]},
    95:{d:"Jul 7 · Atlanta",s:[{w:86},{w:88}]},
    96:{d:"Jul 7 · Vancouver",s:[{w:85},{w:87}]},
    97:{d:"Jul 9 · Boston",s:[{w:89},{w:90}]},
    98:{d:"Jul 10 · Los Angeles",s:[{w:93},{w:94}]},
    99:{d:"Jul 11 · Miami",s:[{w:91},{w:92}]},
    100:{d:"Jul 11 · Kansas City",s:[{w:95},{w:96}]},
    101:{d:"Jul 14 · Dallas",s:[{w:97},{w:98}]},
    102:{d:"Jul 15 · Atlanta",s:[{w:99},{w:100}]},
    103:{d:"Jul 18 · Miami",s:[{l:101},{l:102}]},
    104:{d:"Jul 19 · New York/NJ",s:[{w:101},{w:102}]}
  };

  const LEFT = {
    r32:[74,77,73,75,83,84,81,82],
    r16:[89,90,93,94],
    qf:[97,98],
    sf:[101]
  };
  const RIGHT = {
    r32:[76,78,79,80,86,88,85,87],
    r16:[91,92,95,96],
    qf:[99,100],
    sf:[102]
  };
  const ORDER = []; for (let i=73;i<=104;i++) ORDER.push(i);

  // Actual results as they happen: matchId → winning slot index (0=top, 1=bottom).
  // Update this object and redeploy as matches complete.
  const RESULTS = {
    73:1,  // Canada 1-0 South Africa
    74:1,  // Paraguay bt Germany (1-1, 4-3 pens)
    75:1,  // Morocco bt Netherlands (1-1, 3-2 pens)
    76:0,  // Brazil 2-1 Japan
    77:0,  // France bt Sweden
    78:1,  // Norway 2-1 Ivory Coast
    79:0,  // Mexico 2-0 Ecuador
  };

  let picks = {}, bracketName = "";

  // Generic resolver: `src` is an object mapping matchId → chosen slot index.
  // Passing `picks` gives the user's predicted bracket; `RESULTS` gives reality;
  // a merged {...picks, ...RESULTS} gives the display bracket (reality where known,
  // user prediction elsewhere).
  function teamAt(slot,src){
    if(slot.t) return slot.t;
    if(slot.w!=null) return winnerOf(slot.w,src);
    if(slot.l!=null) return loserOf(slot.l,src);
    return null;
  }
  function winnerOf(id,src){
    const p=src[id]; if(p==null) return null;
    return teamAt(MATCHES[id].s[p],src);
  }
  function loserOf(id,src){
    const p=src[id]; if(p==null) return null;
    return teamAt(MATCHES[id].s[1-p],src);
  }
  function slotTeams(id,src){
    const m=MATCHES[id]; return [teamAt(m.s[0],src),teamAt(m.s[1],src)];
  }

  // Display source: reality wins where known (bracket shows actual advancing teams).
  const displaySrc=()=>Object.assign({},picks,RESULTS);
  // Prediction source: user's picks win; reality fills gaps they haven't picked.
  const mySrc=()=>Object.assign({},RESULTS,picks);

  function setPick(id,slot){
    if(RESULTS[id]!=null) return;                       // completed → locked
    const t=slotTeams(id,displaySrc()); if(!t[slot]) return;
    // Snapshot predicted winners so we can invalidate stale downstream picks.
    const src0=mySrc(), before={};
    for(const mid of ORDER) if(picks[mid]!=null) before[mid]=winnerOf(mid,src0);
    if(picks[id]===slot) delete picks[id]; else picks[id]=slot;
    for(const mid of ORDER){
      if(mid===id||picks[mid]==null) continue;
      if(winnerOf(mid,mySrc())!==before[mid]) delete picks[mid];
    }
    save(); render();
  }

  // ---- URL persistence: compact 11-char base64url of 32×2 bits ---------
  const B64U={
    enc:b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
    dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  };
  function encodePicks(){
    const bytes=new Uint8Array(8);
    for(let i=0;i<ORDER.length;i++){
      const p=picks[ORDER[i]];
      const v=p===0?1:p===1?2:0;               // 00=none 01=top 10=bottom
      bytes[i>>2]|=v<<((i&3)*2);
    }
    return B64U.enc(bytes);
  }
  function decodePicks(s){
    if(!s) return;
    if(/^[01-]+$/.test(s)&&s.length>12){        // legacy long format
      for(let i=0;i<ORDER.length&&i<s.length;i++){
        if(s[i]==='0')picks[ORDER[i]]=0; else if(s[i]==='1')picks[ORDER[i]]=1;
      }
      return;
    }
    try{
      const bytes=B64U.dec(s);
      for(let i=0;i<ORDER.length;i++){
        const v=(bytes[i>>2]>>((i&3)*2))&3;
        if(v===1)picks[ORDER[i]]=0; else if(v===2)picks[ORDER[i]]=1;
      }
    }catch(e){}
  }
  function save(){
    const q=new URLSearchParams();
    if(bracketName) q.set("n",bracketName);
    q.set("p",encodePicks());
    history.replaceState(null,"","#"+q.toString());
  }
  function load(){
    if(!location.hash) return;
    try{
      const q=new URLSearchParams(location.hash.slice(1));
      bracketName=q.get("n")||"";
      decodePicks(q.get("p"));
    }catch(e){}
  }

  function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

  function teamRow(id,idx,code,state){
    // state: {picked, actualWinner, eliminated, locked, wrongPick}
    let cls="team";
    if(!code) cls+=" empty";
    if(state.picked) cls+=" picked";
    if(state.wrongPick) cls+=" wrong-pick";
    if(state.actualWinner) cls+=" actual";
    if(state.eliminated) cls+=" eliminated";
    const d=el("div",cls);
    if(code){
      const t=TEAMS[code];
      d.innerHTML='<span class="flag">'+t.f+'</span><span class="team-name">'+t.n+'</span>';
      if(!state.locked) d.onclick=()=>setPick(id,idx);
    } else {
      const s=MATCHES[id].s[idx];
      const lbl=s.w?"Winner M"+s.w:s.l?"Loser M"+s.l:"—";
      d.innerHTML='<span class="flag"></span><span class="team-name">'+lbl+'</span>';
    }
    return d;
  }

  function matchCard(id,extraCls){
    const shown=slotTeams(id,displaySrc());           // teams on the card (reality-first)
    const done=RESULTS[id]!=null;
    const myWin=picks[id]!=null?winnerOf(id,mySrc()):null;  // team I predicted (my bracket, gaps filled by reality)
    const realWin=done?winnerOf(id,RESULTS):null;
    const verdict=done&&myWin ? (myWin===realWin?"correct":"wrong") : null;

    const c=el("div","match"+(done?" done":"")+(extraCls?" "+extraCls:""));
    c.appendChild(el("span","match-tag","M"+id));
    for(let i=0;i<2;i++){
      const isMyPickRow = picks[id]===i && shown[i]===myWin;   // only highlight if the shown team IS what I predicted
      c.appendChild(teamRow(id,i,shown[i],{
        picked: isMyPickRow,
        actualWinner: done && RESULTS[id]===i,
        eliminated: done && RESULTS[id]!==i,
        locked: done,
        wrongPick: isMyPickRow && verdict==="wrong"
      }));
    }
    if(verdict){
      c.appendChild(el("span","verdict "+verdict, verdict==="correct"?"✓":"✕"));
    }
    // Caption: if I predicted a team that isn't even in this real matchup, note it; else show date/venue.
    if(myWin && shown.indexOf(myWin)===-1){
      c.appendChild(el("span","miss-note","you had "+TEAMS[myWin].n));
    } else {
      c.appendChild(el("span","match-date",MATCHES[id].d));
    }
    return c;
  }
  function column(ids,cls,label){
    const col=el("div","col "+cls);
    col.appendChild(el("div","round-label",label));
    for(const id of ids) col.appendChild(matchCard(id));
    return col;
  }
  function side(half,which){
    const s=el("div","side "+which);
    s.appendChild(column(half.r32,"r32","Round of 32"));
    s.appendChild(column(half.r16,"r16","Round of 16"));
    s.appendChild(column(half.qf,"qf","Quarterfinal"));
    s.appendChild(column(half.sf,"sf","Semifinal"));
    return s;
  }
  function center(){
    const c=el("div","center");
    c.appendChild(el("div","center-label final-label","Final"));
    c.appendChild(matchCard(104,"final"));
    const champ=winnerOf(104,displaySrc());
    const box=el("div","champion"+(champ?" filled":""));
    box.innerHTML='<div class="champion-label">🏆 Champion</div><div class="champion-team">'+
      (champ?'<span class="flag">'+TEAMS[champ].f+'</span><span>'+TEAMS[champ].n+'</span>':'<span style="color:var(--muted);font-weight:400;font-size:13px">—</span>')+
      '</div>';
    c.appendChild(box);
    const tb=el("div","third-block");
    tb.appendChild(el("div","center-label","Third Place"));
    tb.appendChild(matchCard(103));
    c.appendChild(tb);
    return c;
  }

  const root=document.getElementById("bracket");
  function render(){
    root.innerHTML="";
    root.appendChild(side(LEFT,"left"));
    root.appendChild(center());
    root.appendChild(side(RIGHT,"right"));
    // progress + score
    let nPicks=0, nDone=0, nCorrect=0;
    const ms=mySrc();
    for(const id of ORDER){
      if(picks[id]!=null) nPicks++;
      if(RESULTS[id]!=null && picks[id]!=null){
        const my=winnerOf(id,ms);
        if(my){ nDone++; if(my===winnerOf(id,RESULTS)) nCorrect++; }
      }
    }
    document.getElementById("progress").textContent=nPicks+" / 32 picks";
    document.getElementById("score").innerHTML="Score <b>"+nCorrect+"</b>/"+nDone;
    document.getElementById("score").style.display=nDone?"":"none";
    document.getElementById("bracket-name").value=bracketName;
  }

  document.getElementById("bracket-name").oninput=e=>{bracketName=e.target.value;save();};
  let tipTimer=null;
  document.getElementById("share-btn").onclick=()=>{
    save();
    const tip=document.getElementById("copy-tip");
    const done=()=>{
      tip.classList.add("show");
      clearTimeout(tipTimer);
      tipTimer=setTimeout(()=>tip.classList.remove("show"),1800);
    };
    if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(done).catch(()=>prompt("Copy this link:",location.href));
    else prompt("Copy this link:",location.href);
  };
  document.getElementById("reset-btn").onclick=()=>{
    if(Object.keys(picks).length&&!confirm("Clear all picks?"))return;
    picks={};save();render();
  };

  load(); render();
})();
</script>
</body>
</html>
